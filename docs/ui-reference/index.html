:root[data-theme=&quot;light&quot;] {

* {

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))

}

}

  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {

}

h1 {

}

h2 {

  line-height: 1.25;
}

h3,
h4,
h5,
h6 {

}

b,
strong,
th {

}

code:not(pre code) {

  corner-shape: var(--corner-shape);
  background: var(--muted);

.table-responsive {

.table {

}

.table :is(th, td) {

  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: var(--corner-shape);
  color: var(--card-foreground);
  background: var(--card);
}

.widget {
  min-width: 0;
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  box-shadow: 0 0 0 0.5px var(--border-strong, var(--border));
  color: var(--foreground);
  background: var(--background);
}

#widget &gt; :not(.card, .widget, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {

  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

  height: 1px;
  margin-block: 6px;
  border: 0;
  background: var(--border);
}

.nav {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 4px;
}

.progress {

  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar:only-child {

}

.progress-bar {

  flex-shrink: 0;
  border: 0;

}

}

.text-muted {
  color: var(--muted-foreground);
}

.tabular-nums {
  font-variant-numeric: tabular-nums;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.nav-link,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn,
.nav-link {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;

  border: 1px solid var(--input);

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);

  color: var(--muted-foreground);

.nav-pills .nav-link {

  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;

.nav-justified .nav-link {

.nav-pills .nav-link.active {

.viz-dotted-background {

  background-size: 16px 16px;

.viz-carousel {
  position: relative;

.viz-carousel:has(&gt; .viz-carousel-controls) {

  gap: 4px;

  -webkit-app-region: no-drag;
  border: 0;

s=&quot;os-right-panel&quot; id=&quot;os-right&quot;&gt;${state.tab===&#x27;flow&#x27;?nodeDetail():documentPanel()}&lt;/aside&gt;&lt;/div&gt;`;}
function documentPanel(){if(state.scenario===&#x27;approval&#x27;&amp;&amp;state.stage===&#x27;complete&#x27;&amp;&amp;!state.refused)return `&lt;div class=&quot;os-panel-head&quot;&gt;&lt;b&gt;成果预览&lt;/b&gt;${badge(&#x27;合成占位&#x27;)}&lt;/div&gt;&lt;div class=&quot;os-document&quot;&gt;&lt;div class=&quot;os-doc-eyebrow&quot;&gt;VISUAL / PLACEHOLDER&lt;/div&gt;&lt;h3&gt;西湖晨光宣传视觉&lt;/h3&gt;&lt;div style=&quot;aspect-ratio:4/3;display:grid;place-items:center;background:var(--os-panel);border-radius:8px;margin:20px 0;color:var(--os-muted)&quot;&gt;&lt;span&gt;${i(&#x27;image&#x27;)} 视觉成果占位&lt;/span&gt;&lt;/div&gt;&lt;p&gt;正式版本展示实际图片与尺寸。本样板没有生成图片。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;os-doc-actions&quot;&gt;&lt;button class=&quot;os-button&quot; data-action=&quot;visual&quot;&gt;查看交付信息&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;os-bound&quot;&gt;&lt;h3&gt;本次绑定&lt;/h3&gt;&lt;div class=&quot;os-bound-row&quot;&gt;&lt;span&gt;执行角色&lt;/span&gt;&lt;b&gt;设计 Agent&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;os-bound-row&quot;&gt;&lt;span&gt;执行设备&lt;/span&gt;&lt;b&gt;Windows&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;`;if(state.stage===&#x27;approval&#x27;||state.refused)return `&lt;div class=&quot;os-panel-head&quot;&gt;&lt;b&gt;任务上下文&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;os-bound-row&quot;&gt;&lt;span&gt;执行角色&lt;/span&gt;&lt;b&gt;设计 Agent&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;os-bound-row&quot;&gt;&lt;span&gt;执行设备&lt;/span&gt;&lt;b&gt;Windows&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;os-bound-row&quot;&gt;&lt;span&gt;本次操作&lt;/span&gt;&lt;b&gt;生成 1 张图片&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;os-bound&quot;&gt;&lt;h3&gt;权限边界&lt;/h3&gt;&lt;p class=&quot;os-panel-caption&quot;&gt;确认绑定本次调用与参数。修改参数需要新的裁定；安装工具不自动获得执行权限。&lt;/p&gt;&lt;/div&gt;`;return `&lt;div class=&quot;os-panel-head&quot;&gt;&lt;b&gt;成果预览&lt;/b&gt;&lt;button data-action=&quot;source&quot; aria-label=&quot;查看成果来源&quot;&gt;${i(&#x27;book-open&#x27;)}&lt;/button&gt;&lt;/div&gt;&lt;article class=&quot;os-document&quot;&gt;&lt;div class=&quot;os-doc-eyebrow&quot;&gt;AGENTOS / DELIVERABLE&lt;/div&gt;&lt;h3&gt;${state.scenario===&#x27;simple&#x27;?&#x27;项目进展周报&#x27;:&#x27;春季活动方案&#x27;}&lt;/h3&gt;&lt;p&gt;版本 v${state.revision} · 合成内容&lt;/p&gt;&lt;div class=&quot;os-doc-divider&quot;&gt;&lt;/div&gt;&lt;h4&gt;01 / ${state.scenario===&#x27;simple&#x27;?&#x27;进展摘要&#x27;:&#x27;活动方向&#x27;}&lt;/h4&gt;&lt;p&gt;${state.scenario===&#x27;simple&#x27;?&#x27;已完成 2 项任务，剩余 1 项阻塞于资料输入缺失。&#x27;:&#x27;以春日城市漫步为主题，结合品牌规范中的自然、克制与轻量表达。&#x27;}&lt;/p&gt;&lt;h4&gt;02 / ${state.scenario===&#x27;simple&#x27;?&#x27;阻塞与下一步&#x27;:&#x27;执行建议&#x27;}&lt;/h4&gt;&lt;p&gt;${state.scenario===&#x27;simple&#x27;?&#x27;补齐缺失资料后继续验证。该项为建议，不属于已完成事实。&#x27;:&#x27;线上素材与线下活动配合；活动日期等待确认，避免使用未经证实的承诺。&#x27;}&lt;/p&gt;&lt;h4&gt;03 / 来源与未决项&lt;/h4&gt;&lt;div class=&quot;os-doc-quote&quot;&gt;${state.scenario===&#x27;simple&#x27;?&#x27;[1] 项目记录，第 2 段&#x27;:&#x27;[1] 品牌规范，第 3 节&#x27;}&lt;br&gt;引用已关联来源片段。&lt;/div&gt;&lt;/article&gt;&lt;div class=&quot;os-doc-actions&quot;&gt;&lt;button class=&quot;os-button os-primary&quot; data-action=&quot;download&quot;&gt;${i(&#x27;download&#x27;)}下载示例&lt;/button&gt;&lt;button class=&quot;os-button&quot; data-action=&quot;revise&quot;&gt;${i(&#x27;pencil&#x27;)}修改&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;os-panel-caption&quot;&gt;${state.scenario===&#x27;complex&#x27;?&#x27;评审返修 1 次 · 视觉成果沿用 v1&#x27;:&#x27;结构与引用检查通过&#x27;} · 合成示例&lt;/p&gt;${state.scenario===&#x27;complex&#x27;?`&lt;button class=&quot;os-artifact-extra&quot; data-action=&quot;visual&quot;&gt;${i(&#x27;image&#x27;)}&lt;span&gt;活动宣传视觉&lt;small&gt;占位卡 · 样板不生成真实媒体&lt;/small&gt;&lt;/span&gt;&lt;/button&gt;`:&#x27;&#x27;}&lt;div class=&quot;os-bound&quot;&gt;&lt;h3&gt;本次绑定&lt;/h3&gt;&lt;div class=&quot;os-bound-row&quot;&gt;&lt;span&gt;知识后端&lt;/span&gt;&lt;b&gt;${backend()}&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;os-bound-row&quot;&gt;&lt;span&gt;Skill&lt;/span&gt;&lt;b&gt;${state.scenario===&#x27;simple&#x27;?&#x27;report-writer&#x27;:&#x27;campaign-kit&#x27;} · v1.2&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;os-bound-row&quot;&gt;&lt;span&gt;执行设备&lt;/span&gt;&lt;b&gt;${state.scenario===&#x27;complex&#x27;?&#x27;本地 + Windows&#x27;:&#x27;本地&#x27;}&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;os-bound-row&quot;&gt;&lt;span&gt;模型 / 费用&lt;/span&gt;&lt;b&gt;样板未记录&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;`;}
const nodes=[{id:&#x27;goal&#x27;,title:&#x27;理解目标与安排协作&#x27;,role:&#x27;协调 Agent&#x27;,machine:&#x27;本地&#x27;,icon:&#x27;list-tree&#x27;,input:&#x27;用户目标、材料引用与预算边界&#x27;,output:&#x27;计划 v1，明确研究、设计与评审依赖&#x27;,tools:&#x27;目标整理、计划校验&#x27;,status:&#x27;计划已保存&#x27;}, {id:&#x27;research&#x27;,title:&#x27;研究与方案整理&#x27;,role:&#x27;研究 Agent&#x27;,machine:&#x27;本地&#x27;,icon:&#x27;book-open&#x27;,input:&#x27;品牌规范、活动简报&#x27;,output:&#x27;方案 v2，补齐来源与未决项&#x27;,tools:&#x27;knowledge.search · &#x27;+backend(),status:&#x27;已返修 1 次&#x27;}, {id:&#x27;design&#x27;,title:&#x27;视觉设计执行&#x27;,role:&#x27;设计 Agent&#x27;,machine:&#x27;Windows&#x27;,icon:&#x27;image&#x27;,input:&#x27;风格约束与已授权素材&#x27;,output:&#x27;宣传视觉 v1，成果引用&#x27;,tools:&#x27;图像生成工具&#x27;,status:&#x27;成果复用&#x27;}, {id:&#x27;merge&#x27;,title:&#x27;汇总方案与视觉&#x27;,role:&#x27;协调 Agent&#x27;,machine:&#x27;本地&#x27;,icon:&#x27;combine&#x27;,input:&#x27;研究与设计两路成果&#x27;,output:&#x27;待评审的交付集合&#x27;,tools:&#x27;Asset 读取与关联&#x27;,status:&#x27;已汇总&#x27;}, {id:&#x27;review&#x27;,title:&#x27;质量与来源评审&#x27;,role:&#x27;评审 Agent&#x27;,machine:&#x27;本地&#x27;,icon:&#x27;shield-check&#x27;,input:&#x27;方案、引用与视觉成果&#x27;,output:&#x27;第一次：退回补充来源；第二次：通过&#x27;,tools:&#x27;引用回查 + 确定性检查&#x27;,status:&#x27;第 2 次通过&#x27;}, {id:&#x27;finish&#x27;,title:&#x27;最终交付&#x27;,role:&#x27;协调 Agent&#x27;,machine:&#x27;本地&#x27;,icon:&#x27;package-check&#x27;,input:&#x27;检查通过的版本与成果&#x27;,output:&#x27;方案 v2、视觉 v1，保留修改关系&#x27;,tools:&#x27;成果登记与授权下载&#x27;,status:&#x27;已交付&#x27;}];
