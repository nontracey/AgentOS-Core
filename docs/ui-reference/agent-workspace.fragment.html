<script>
(()=>{
const root=document.getElementById('agentos-concept');
const body=root.querySelector('#os-content');
const overlay=root.querySelector('#os-overlay');
const state={view:'home',scenario:'complex',tab:'chat',stage:'complete',step:0,hub:'all',backend:'weknora',boundBackend:'weknora',node:'review',running:false,paused:false,characters:0,attached:false,filter:'all',revision:1,reason:'',failure:false,refused:false,userGoal:'',reply:'',notification:true};
const design={split:true,accent:'#4e5cc8',layout:'对话优先'};
let streamTimer=null,toastTimer=null,graphObserver=null,focusRestore=null;
const i=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const e=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const badge=(text,type='')=>`<span class="os-badge ${type}">${text}</span>`;
function streamText(t,stage){return (state.running||state.paused)&&state.step===stage?e(t.slice(0,state.characters))+(state.running?'<span class="os-stream-caret" aria-hidden="true"></span>':''):e(t);}
const backend=()=>state.boundBackend==='weknora'?'WeKnora':'内置检索';
const title=()=>state.scenario==='simple'?'项目进展周报':state.scenario==='approval'?'西湖主题宣传素材':'春季活动方案与视觉素材';
const goal=()=>state.userGoal||(state.scenario==='simple'?'根据这份项目记录，整理本周进展、阻塞和下一步，生成一份有来源的周报。':state.scenario==='approval'?'生成一张西湖晨光主题的宣传图，使用 Windows 的图像工具，生成一次即可。':'结合知识库里的品牌规范，做一份春季活动方案，生成宣传视觉，并检查文案和引用。最终交付方案与素材。');
const icons=()=>{root.querySelectorAll('button').forEach(b=>b.classList.add('cursor-interaction'));if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});};
function save(){if(globalThis.openai?.setWidgetState)globalThis.openai.setWidgetState({modelContent:{screen:state.view,scenario:state.scenario,tab:state.tab,knowledgeBackend:state.backend,layout:design.layout},privateContent:{split:design.split}}).catch(()=>{});}
function stopStream(){if(streamTimer)clearTimeout(streamTimer);streamTimer=null;state.running=false;}
function toast(t){root.querySelector('#os-toast').textContent=t;root.querySelector('#os-toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>root.querySelector('#os-toast').style.display='none',3200);}
function navigate(v){stopStream();overlay.innerHTML='';state.view=v;root.querySelector('.os-sidebar').classList.remove('is-open');render();save();}
function openScenario(s,play=false){stopStream();overlay.innerHTML='';root.querySelector('.os-sidebar').classList.remove('is-open');state.scenario=s;state.view='thread';state.tab=design.layout==='协作优先'&&s==='complex'?'flow':'chat';state.stage=s==='approval'?'approval':'complete';state.boundBackend=state.backend;state.failure=false;state.refused=false;state.paused=false;state.revision=s==='complex'?2:1;state.reason='';state.reply='';state.userGoal='';state.step=play?0:6;render();if(play)startReplay();save();}
function home(){return `<section class="os-home"><div class="os-greeting">${i('sparkles')} 你的想法，从这里开始</div><h1>今天，我们完成什么？</h1><p>交给我一个目标。简单的直接做，复杂的协作完成。</p><form class="os-composer" id="os-start-form"><label for="os-goal" style="position:absolute;width:1px;height:1px;overflow:hidden">任务目标</label><textarea id="os-goal" placeholder="描述你想完成的事，也可以添加资料…"></textarea><div class="os-compose-footer"><div class="os-compose-tools"><button type="button" data-action="attach">${i('paperclip')} ${state.attached?'项目记录.md':'添加资料'}</button><select aria-label="执行方式" id="os-mode"><option value="auto">自动选择执行方式</option><option value="simple">直接处理</option><option value="complex">协作处理</option></select></div><button class="os-send" type="submit" aria-label="开始任务">${i('arrow-up')}</button></div></form><div class="os-context-line"><span>${i('shield-check')} 重要操作执行前由你确认</span><span>${i('database')} ${state.backend==='weknora'?'WeKnora':'内置检索'} · 示例配置</span></div><div class="os-example-grid"><button class="os-example" data-scenario="simple">${i('file-text')}<strong>整理一份项目周报</strong><span>读取资料 → 整理 → 引用检查</span><small>简单任务 · 直接交付</small></button><button class="os-example" data-scenario="complex">${i('workflow')}<strong>完成活动方案与素材</strong><span>研究、设计与评审协作完成</span><small>复杂任务 · 接力与返修</small></button><button class="os-example" data-scenario="approval">${i('image')}<strong>生成一张宣传视觉</strong><span>确认生成参数，交给执行设备</span><small>工具任务 · 人工确认</small></button></div><div class="os-recent-home"><div class="os-subhead"><h3>继续上次的工作</h3><button data-view="tasks">全部任务 ${i('arrow-right')}</button></div><button class="os-home-task" data-scenario="complex">${i('folder-open')}<span><b>春季活动方案与视觉素材</b><small>方案与视觉稿 · 含一轮评审返修</small></span>${badge('已交付','good')}</button><button class="os-home-task" data-scenario="approval">${i('image')}<span><b>西湖主题宣传素材</b><small>执行前需要确认生成参数</small></span>${badge('需要你确认','wait')}</button></div></section>`;}
function tasks(){const rows=[['complex','春季活动方案与视觉素材','品牌知识检索、设计执行、评审返修后交付','4 个角色 · 2 个设备 · 方案与视觉稿','已交付','good'],['simple','整理项目本周进展','项目记录已整理为带来源的周报','1 个角色 · 1 个设备 · 周报 v1','已交付','good'],['approval','西湖主题宣传素材','等待确认本次图像生成的内容与参数','1 个角色 · Windows 执行设备','需要你确认','wait']].filter(r=>state.filter!=='attention'||r[0]==='approval');return `<section class="os-page"><div class="os-page-heading"><div><h2>任务空间</h2><p>任务会持续保存，随时回来继续。</p></div><button class="os-button os-primary" data-view="home">${i('plus')}新任务</button></div><div class="os-tabs" aria-label="任务筛选">${[['all','全部任务'],['attention','需要我处理']].map(([k,t])=>`<button data-filter="${k}" class="${state.filter===k?'is-active':''}">${t}${k==='attention'?' · 1':''}</button>`).join('')}</div>${rows.map(r=>`<button class="os-task-row" data-scenario="${r[0]}"><span><strong>${r[1]}</strong><p>${r[2]}</p><small>${r[3]}</small></span><span>${badge(r[4],r[5])}</span></button>`).join('')}</section>`;}
const tool=(icon,name,desc,status='完成')=>`<button class="os-tool-row" data-action="tool-detail">${i(icon)}<span><b>${name}</b><small>${desc}</small></span><small>${status}</small></button>`;
function artifactInline(){return `<button class="os-inline-artifact" data-action="open-artifact"><span class="os-file-symbol">${i('file-text')}</span><span><b>${state.scenario==='simple'?'项目进展周报':state.scenario==='approval'?'宣传视觉（占位）':'春季活动方案'} · v${state.revision}</b><small>Markdown · 来源可回查 · 点击预览</small></span>${i('arrow-up-right')}</button>`;}
function approval(){return `<section class="os-approval"><h3>${i('shield-check')}这一步需要你确认</h3><p>将在 Windows 执行设备生成一张宣传图。批准后只执行本次调用。</p><dl><dt>生成内容</dt><dd>西湖晨光主题宣传视觉</dd><dt>执行工具</dt><dd>ComfyUI · 图像生成</dd><dt>关键参数</dt><dd>1024 × 768 · 生成 1 张</dd><dt>影响范围</dt><dd>使用本地 GPU，保存本任务成果</dd><dt>确认原因</dt><dd>服务端策略要求外部生成前确认</dd></dl><div class="os-approval-actions"><button class="os-button os-primary" data-action="approve">${i('check')}允许本次执行</button><button class="os-button" data-action="reject">拒绝</button></div></section>`;}
function messageContent(){if(state.refused)return `<div class="os-response">已拒绝这次生成，任务已停止。你可以修改目标后创建新的任务。</div>`;if(state.stage==='approval')return `<div class="os-response">生成内容和执行设备已确定，等待你确认这次操作。</div>${tool('cpu','执行设备已匹配','Windows · ComfyUI · 图像生成','待确认')}${approval()}`;const simple=state.scenario==='simple',complex=state.scenario==='complex';const n=state.running||state.paused?state.step:7;return `${n>=1?`<div class="os-response">${streamText(simple?'我会整理材料中的进展、阻塞与建议，并保留事实来源。':complex?'这项任务包含品牌研究、方案与视觉设计、质量检查。我会按依赖安排协作，交付前核对来源和成果。':'参数已确认，开始执行这次图像生成。',1)}</div>`:''}${complex&&n>=1?`<div class="os-execution-summary"><div class="os-summary-top"><b>协作计划 · v2</b><button data-tab="flow">查看执行图 ${i('arrow-up-right')}</button></div><div class="os-plan-mini"><span>品牌研究</span>${i('arrow-right')}<span>方案与设计</span>${i('arrow-right')}<span>评审</span>${i('arrow-right')}<span>交付</span></div></div>`:''}${n>=2?tool(simple?'file-search':'database',simple?'读取授权材料':`检索品牌知识 · ${backend()}`,simple?'项目记录.md · 已加载报告整理 Skill':'研究 Agent · 检索 3 个来源片段'):''}${n>=3?tool('file-pen-line',simple?'整理进展与下一步':'方案与视觉并行处理',simple?'执行 Agent · 本地设备':'研究 Agent 整理方案 · 设计 Agent 调用 Windows 工具'):''}${complex&&n>=4?`<div class="os-loop-note"><b>评审 → 研究 Agent · 第 1 次返修</b><br>活动日期的引用缺少依据。仅补充来源与修改文案，已生成的视觉稿继续复用。</div>`:''}${n>=5?tool('shield-check',simple?'引用与结构检查通过':'完成检查与汇总',simple?'事实有来源，建议单独标注':'评审 Agent · 已回查引用，收到视觉成果'):''}${n>=6?`<div class="os-result-text">${streamText(simple?'周报已整理完成。3 个任务中 2 个已完成，1 个因输入缺失阻塞。下一步建议已与材料事实分开标注。':complex?'方案与视觉稿已整理完成。日期信息保持待确认，文案引用已补齐，视觉稿复用了先前生成的版本。':'宣传图已完成，等待你检查内容与下载。',6)}</div>${artifactInline()}<div class="os-sources"><button data-action="source">${i('quote')} ${simple?'项目记录 §2':'品牌规范 §3'}</button>${complex?'<button data-action="source">活动简报 §1</button>':''}</div>`:''}${state.running?`<div class="os-live-row"><span class="os-tiny-dot"></span>示例事件流正在更新 · ${['准备任务','安排执行','读取来源','执行与交接','评审返修','检查成果','汇总交付'][Math.min(state.step,6)]}</div>`:`<div class="os-chat-actions"><span>示例运行 · 用量与费用未记录</span><div><button data-action="replay">${i('play')}重放过程</button><button data-action="revise">${i('message-square-plus')}提出修改</button></div></div>`}${state.reason?`<div class="os-loop-note">修改理由：${e(state.reason)}<br>新版本 v${state.revision} 已关联原成果，原版本保留。</div>`:''}${state.reply?`<div class="os-response" style="margin-top:12px">${e(state.reply)}</div>`:''}${state.failure?`<section class="os-failure"><b>成果已生成，回传未完成</b><p>生成结果已确认。补传将使用原文件，不重新执行生成。</p><button class="os-button" data-action="deliver">${i('upload')}补传已有成果</button></section>`:''}`;}
function thread(){const status=state.refused?'已停止':state.failure?'等待补传':state.stage==='approval'?'需要你确认':state.paused?'回放已暂停':state.running?'执行中':'已交付';return `<section class="os-work-header"><div class="os-work-title"><h2>${title()}</h2>${badge(status,state.stage==='approval'||state.failure?'wait':state.running?'active':'good')}</div><div class="os-work-meta"><span>${state.scenario==='complex'?'协作任务 · 4 个角色':'直接任务 · 1 个角色'}</span><span>·</span><span>${state.scenario==='complex'?'2 个执行设备':'1 个执行设备'}</span><span>·</span><span>示例数据</span></div><div class="os-tabs" aria-label="任务视图">${[['chat','对话'],['flow','执行图'],['files','成果']].map(([k,t])=>`<button data-tab="${k}" aria-pressed="${state.tab===k}" class="${state.tab===k?'is-active':''}">${t}${k==='files'&&!state.refused&&state.stage!=='approval'?' · '+(state.scenario==='complex'?'2':'1'):''}</button>`).join('')}</div></section><div class="os-workspace">${state.tab==='chat'?`<section class="os-conversation"><div class="os-user-label">你</div><div class="os-user-msg">${e(goal())}</div><div class="os-agent-label"><span class="os-logomark">${i('orbit')}</span>AgentOS<span>${state.scenario==='complex'?'协作执行':'直接执行'}</span></div><div id="os-stream-area">${messageContent()}</div><form class="os-thread-composer" id="os-reply-form"><label for="os-reply" style="position:absolute;width:1px;height:1px;overflow:hidden">补充要求或修改说明</label><textarea id="os-reply" placeholder="补充要求，或告诉我哪里需要修改…"></textarea><div class="os-compose-footer"><div class="os-compose-tools"><button type="button" data-action="attach">${i('paperclip')}</button><span class="os-muted" style="font-size:11px">${state.running?'任务进行中，可暂停查看':'继续这项工作'}</span></div>${state.running?`<button class="os-button" type="button" data-action="pause">${i('square')}暂停演示</button>`:`<button class="os-send" type="submit" aria-label="发送修改要求">${i('arrow-up')}</button>`}</div></form></section>`:state.tab==='flow'?flow():`<section class="os-conversation"><div class="os-subhead"><h3>本次成果</h3><span class="os-muted" style="font-size:11px">不可变版本</span></div>${state.stage==='approval'||state.refused?'<p class="os-muted">尚未生成成果。</p>':`${artifactInline()}${state.scenario==='complex'?`<button class="os-inline-artifact" data-action="visual"><span class="os-file-symbol">${i('image')}</span><span><b>活动宣传视觉 · v1</b><small>视觉成果占位 · 未生成真实图片</small></span>${i('arrow-up-right')}</button>`:''}<p class="os-panel-caption">查看来源、版本与修改关系；旧成果始终保留。</p><button class="os-button" data-action="revise">${i('git-branch')}基于成果提出修改</button>`}</section>`}<aside class="os-right-panel" id="os-right">${state.tab==='flow'?nodeDetail():documentPanel()}</aside></div>`;}
function documentPanel(){if(state.scenario==='approval'&&state.stage==='complete'&&!state.refused)return `<div class="os-panel-head"><b>成果预览</b>${badge('合成占位')}</div><div class="os-document"><div class="os-doc-eyebrow">VISUAL / PLACEHOLDER</div><h3>西湖晨光宣传视觉</h3><div style="aspect-ratio:4/3;display:grid;place-items:center;background:var(--os-panel);border-radius:8px;margin:20px 0;color:var(--os-muted)"><span>${i('image')} 视觉成果占位</span></div><p>正式版本展示实际图片与尺寸。本样板没有生成图片。</p></div><div class="os-doc-actions"><button class="os-button" data-action="visual">查看交付信息</button></div><div class="os-bound"><h3>本次绑定</h3><div class="os-bound-row"><span>执行角色</span><b>设计 Agent</b></div><div class="os-bound-row"><span>执行设备</span><b>Windows</b></div></div>`;if(state.stage==='approval'||state.refused)return `<div class="os-panel-head"><b>任务上下文</b></div><div class="os-bound-row"><span>执行角色</span><b>设计 Agent</b></div><div class="os-bound-row"><span>执行设备</span><b>Windows</b></div><div class="os-bound-row"><span>本次操作</span><b>生成 1 张图片</b></div><div class="os-bound"><h3>权限边界</h3><p class="os-panel-caption">确认绑定本次调用与参数。修改参数需要新的裁定；安装工具不自动获得执行权限。</p></div>`;return `<div class="os-panel-head"><b>成果预览</b><button data-action="source" aria-label="查看成果来源">${i('book-open')}</button></div><article class="os-document"><div class="os-doc-eyebrow">AGENTOS / DELIVERABLE</div><h3>${state.scenario==='simple'?'项目进展周报':'春季活动方案'}</h3><p>版本 v${state.revision} · 合成内容</p><div class="os-doc-divider"></div><h4>01 / ${state.scenario==='simple'?'进展摘要':'活动方向'}</h4><p>${state.scenario==='simple'?'已完成 2 项任务，剩余 1 项阻塞于资料输入缺失。':'以春日城市漫步为主题，结合品牌规范中的自然、克制与轻量表达。'}</p><h4>02 / ${state.scenario==='simple'?'阻塞与下一步':'执行建议'}</h4><p>${state.scenario==='simple'?'补齐缺失资料后继续验证。该项为建议，不属于已完成事实。':'线上素材与线下活动配合；活动日期等待确认，避免使用未经证实的承诺。'}</p><h4>03 / 来源与未决项</h4><div class="os-doc-quote">${state.scenario==='simple'?'[1] 项目记录，第 2 段':'[1] 品牌规范，第 3 节'}<br>引用已关联来源片段。</div></article><div class="os-doc-actions"><button class="os-button os-primary" data-action="download">${i('download')}下载示例</button><button class="os-button" data-action="revise">${i('pencil')}修改</button></div><p class="os-panel-caption">${state.scenario==='complex'?'评审返修 1 次 · 视觉成果沿用 v1':'结构与引用检查通过'} · 合成示例</p>${state.scenario==='complex'?`<button class="os-artifact-extra" data-action="visual">${i('image')}<span>活动宣传视觉<small>占位卡 · 样板不生成真实媒体</small></span></button>`:''}<div class="os-bound"><h3>本次绑定</h3><div class="os-bound-row"><span>知识后端</span><b>${backend()}</b></div><div class="os-bound-row"><span>Skill</span><b>${state.scenario==='simple'?'report-writer':'campaign-kit'} · v1.2</b></div><div class="os-bound-row"><span>执行设备</span><b>${state.scenario==='complex'?'本地 + Windows':'本地'}</b></div><div class="os-bound-row"><span>模型 / 费用</span><b>样板未记录</b></div></div>`;}
const nodes=[{id:'goal',title:'理解目标与安排协作',role:'协调 Agent',machine:'本地',icon:'list-tree',input:'用户目标、材料引用与预算边界',output:'计划 v1，明确研究、设计与评审依赖',tools:'目标整理、计划校验',status:'计划已保存'}, {id:'research',title:'研究与方案整理',role:'研究 Agent',machine:'本地',icon:'book-open',input:'品牌规范、活动简报',output:'方案 v2，补齐来源与未决项',tools:'knowledge.search · '+backend(),status:'已返修 1 次'}, {id:'design',title:'视觉设计执行',role:'设计 Agent',machine:'Windows',icon:'image',input:'风格约束与已授权素材',output:'宣传视觉 v1，成果引用',tools:'图像生成工具',status:'成果复用'}, {id:'merge',title:'汇总方案与视觉',role:'协调 Agent',machine:'本地',icon:'combine',input:'研究与设计两路成果',output:'待评审的交付集合',tools:'Asset 读取与关联',status:'已汇总'}, {id:'review',title:'质量与来源评审',role:'评审 Agent',machine:'本地',icon:'shield-check',input:'方案、引用与视觉成果',output:'第一次：退回补充来源；第二次：通过',tools:'引用回查 + 确定性检查',status:'第 2 次通过'}, {id:'finish',title:'最终交付',role:'协调 Agent',machine:'本地',icon:'package-check',input:'检查通过的版本与成果',output:'方案 v2、视觉 v1，保留修改关系',tools:'成果登记与授权下载',status:'已交付'}];
function flow(){const simple=state.scenario!=='complex';const list=simple?[{...nodes[0],role:'执行 Agent'},{...nodes[1],title:'读取与直接处理',role:'执行 Agent',status:'已完成'},{...nodes[4],role:'执行 Agent'},{...nodes[5],role:'执行 Agent'}]:nodes;return `<section class="os-flow-page"><div class="os-flow-toolbar"><span>${simple?'直接处理 · 无需角色拆分':'计划 v2 · 已合并一轮局部返修'}</span><button class="os-button os-mobile-open" data-action="show-node">步骤详情</button></div><div class="os-graph" id="os-graph"><svg class="os-graph-lines" aria-label="任务依赖与评审返修连接" role="img"><defs><marker id="os-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--os-muted)"></path></marker><marker id="os-return-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--os-accent)"></path></marker></defs><g id="os-edges"></g></svg><div class="os-graph-grid">${list.map(n=>`<button class="os-graph-node ${simple||!['research','design'].includes(n.id)?'center':''} ${state.node===n.id?'is-selected':''}" data-node="${n.id}">${i(n.icon)}<span><b>${n.title}</b><small>${n.role} · ${n.machine}</small>${badge(n.status,n.id==='review'?'active':'good')}</span></button>`).join('')}</div>${!simple?'<span class="os-graph-loop">评审退回 · 补来源 · 保留已完成设计</span>':''}</div><div class="os-flow-legend"><span>实线：依赖与成果传递</span>${!simple?'<span>虚线：历史返修事件（非当前 DAG 依赖）</span>':''}<span>角色与设备分别标注</span></div><p class="os-panel-caption">执行图为设计示例；正式接入后由已保存计划和实际事件驱动。</p></section>`;}
function nodeDetail(){const base=nodes.find(n=>n.id===state.node)||nodes[4];const n=state.scenario==='complex'?{...base,tools:base.id==='research'?'knowledge.search · '+backend():base.tools}:{...base,role:'执行 Agent',title:base.id==='research'?'读取与直接处理':base.title};return `<div class="os-panel-head"><b>步骤详情</b>${badge(n.status,'active')}</div><section class="os-node-details"><h3>${n.title}</h3><p>${n.role} 负责这一步，${n.machine} 提供执行能力。</p><div class="os-detail-section"><h4>输入</h4><p>${e(n.input)}</p></div><div class="os-detail-section"><h4>输出与验收</h4><p>${e(n.output)}</p></div><div class="os-detail-section"><h4>实际能力</h4><p>${e(n.tools)}</p></div><div class="os-detail-section"><h4>本次执行</h4><div class="os-bound-row"><span>角色</span><b>${n.role}</b></div><div class="os-bound-row"><span>设备</span><b>${n.machine}</b></div><div class="os-bound-row"><span>结果</span><b>${n.status}</b></div></div><div class="os-bound"><h3>步骤检查器</h3><button class="os-text-button" data-action="tool-detail">查看指令与参数 ${i('arrow-up-right')}</button><p class="os-panel-caption">展示可审计的指令、输入输出与交接事件，模型内部推理不进入界面。</p></div></section>`;}
function drawEdges(){const graph=root.querySelector('#os-graph');if(!graph)return;const g=graph.getBoundingClientRect();const svg=graph.querySelector('.os-graph-lines');svg.setAttribute('viewBox',`0 0 ${g.width} ${g.height}`);const p=id=>{const el=graph.querySelector(`[data-node="${id}"]`);if(!el)return null;const r=el.getBoundingClientRect();return{x:r.left-g.left,y:r.top-g.top,w:r.width,h:r.height};};const simple=state.scenario!=='complex';const edges=simple?[['goal','research'],['research','review'],['review','finish']]:[['goal','research'],['goal','design'],['research','merge'],['design','merge'],['merge','review'],['review','finish']];let paths=edges.map(([a,b])=>{const A=p(a),B=p(b);if(!A||!B)return'';const x=A.x+A.w/2,y=A.y+A.h,bx=B.x+B.w/2,by=B.y,mid=(y+by)/2;return `<path d="M ${x} ${y} C ${x} ${mid},${bx} ${mid},${bx} ${by}" fill="none" stroke="var(--os-muted)" stroke-opacity=".45" stroke-width="1.3" marker-end="url(#os-arrow)"/>`;}).join('');if(!simple){const A=p('review'),B=p('research');if(A&&B)paths+=`<path d="M ${A.x} ${A.y+A.h/2} L 5 ${A.y+A.h/2} L 5 ${B.y+B.h/2} L ${B.x} ${B.y+B.h/2}" fill="none" stroke="var(--os-accent)" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#os-return-arrow)"/>`;}graph.querySelector('#os-edges').innerHTML=paths;}
function hub(){const cards=[['mcp','plug','WeKnora MCP','已发现','good','知识检索与来源阅读，接入统一工具调用边界。','Streamable HTTP · 只读范围','工具与连接'],['mcp','cpu','Windows 工具','已连接','good','图像与视频生成，由已配对执行设备提供能力。','Node 传输 · 受控生成','查看能力'],['skill','book-marked','报告整理 Skill','v1.2','','整理事实、冲突和未决项，要求保留来源引用。','版本固定 · 按需加载','版本与权限'],['skill','workflow','活动交付 Skill','v1.2','','组织研究、设计与评审，定义交接和成果标准。','角色可复用 · 设备独立','版本与权限'],['knowledge','database','WeKnora','外部后端','active','知识检索、来源回查，通过统一 KnowledgePort 适配。',state.backend==='weknora'?'新任务默认使用':'可切换 · 历史任务不变',state.backend==='weknora'?'当前后端':'设为默认'],['knowledge','hard-drive','内置检索','本地后端','','轻量材料检索，用于本地任务与明确选择的回退。',state.backend==='builtin'?'新任务默认使用':'可切回 · 保留引用归属',state.backend==='builtin'?'当前后端':'设为默认'],['nodes','laptop','本地执行设备','示例在线','good','资料处理、协调与评审。可执行多个 Agent 角色。','CPU · 文本与知识处理','设备详情'],['nodes','monitor','Windows 执行设备','示例在线','good','提供 GPU 图像与视频工具，Agent 按能力调用。','GPU · 图像与视频','设备详情']].filter(c=>state.hub==='all'||c[0]===state.hub);return `<section class="os-page"><div class="os-page-heading"><div><h2>能力中心</h2><p>连接工具、加载技能，为任务提供合适的能力。</p></div><button class="os-button os-primary" data-action="connect">${i('plus')}连接能力</button></div><div class="os-tabs" aria-label="能力分类">${[['all','全部'],['mcp','MCP 工具'],['skill','Skills'],['knowledge','知识后端'],['nodes','执行设备']].map(([k,t])=>`<button class="${state.hub===k?'is-active':''}" data-hub="${k}">${t}</button>`).join('')}</div><div class="os-hub-grid">${cards.map(c=>`<article class="os-capability"><div class="os-cap-top"><span class="os-cap-icon">${i(c[1])}</span><h3>${c[2]}</h3>${badge(c[3],c[4])}</div><p>${c[5]}</p><div class="os-cap-foot"><span>${c[6]}</span><button ${c[0]==='knowledge'?`data-backend="${c[2]==='WeKnora'?'weknora':'builtin'}"`:`data-cap="${e(c[2])}"`}>${c[7]} ${i('arrow-up-right')}</button></div></article>`).join('')}</div><p class="os-hub-note">${i('info')}连接、健康、版本与切换均为交互样板。正式运行需要真实探针与契约验收，切换不改变在途任务。</p></section>`;}
function library(){return `<section class="os-page"><div class="os-page-heading"><div><h2>成果库</h2><p>完成的工作，连同来源和版本一起保存。</p></div>${badge('合成示例')}</div><div class="os-library-grid">${[['项目进展周报','项目记录中的完成情况、阻塞与下一步','simple'],['春季活动方案','品牌研究、活动建议与待确认事项','complex']].map(([t,d,s])=>`<article class="os-library-card"><div class="os-file-preview"><small class="os-muted">MARKDOWN · v1</small><h3>${t}</h3><p>${d}</p><div class="os-doc-divider"></div><small class="os-muted">摘要 / 关键结论 / 来源与未决项</small></div><h3>${t}</h3><p>有来源 · 保留修改关系 · 合成示例</p><div class="os-library-actions"><button class="os-button" data-scenario="${s}">${i('arrow-up-right')}打开任务</button><button class="os-button" data-action="download">${i('download')}下载示例</button></div></article>`).join('')}</div></section>`;}
function settings(){return `<section class="os-page"><div class="os-page-heading"><div><h2>偏好设置</h2><p>先按你的工作方式组织界面。</p></div></div><div class="os-settings-row"><span>工作区布局<small>对话优先，或默认展开协作执行图</small></span><select id="os-layout"><option ${design.layout==='对话优先'?'selected':''}>对话优先</option><option ${design.layout==='协作优先'?'selected':''}>协作优先</option></select></div><div class="os-settings-row"><span>成果侧栏<small>电脑上并排预览，手机上按需打开</small></span><button class="os-button" data-action="split">${design.split?'已开启':'已关闭'}</button></div><div class="os-settings-row"><span>重要操作<small>审批由服务端裁定，在任务内确认</small></span>${badge('服务端管理')}</div><div class="os-settings-row"><span>数据与用量<small>正式接入后展示实际记录，不补造指标</small></span>${badge('样板未记录')}</div></section>`;}
function render(){if(graphObserver)graphObserver.disconnect();graphObserver=null;root.classList.toggle('os-split-off',!design.split);root.style.setProperty('--os-accent',design.accent);root.querySelector('#os-breadcrumb').textContent=({home:'我的工作空间',tasks:'任务空间',library:'成果库',hub:'能力中心',settings:'偏好设置',thread:'任务空间 / '+title()})[state.view];root.querySelectorAll('.os-nav [data-view]').forEach(b=>b.classList.toggle('is-active',b.dataset.view===state.view||(state.view==='thread'&&b.dataset.view==='tasks')));body.innerHTML=({home,tasks,thread,hub,library,settings})[state.view]();icons();bindForms();if(state.tab==='flow'&&state.view==='thread'){graphObserver=new ResizeObserver(drawEdges);graphObserver.observe(root.querySelector('#os-graph'));requestAnimationFrame(drawEdges);}root.querySelector('.os-notification-dot').style.display=state.notification?'block':'none';}
function bindForms(){root.querySelector('#os-start-form')?.addEventListener('submit',ev=>{ev.preventDefault();const goalText=root.querySelector('#os-goal').value.trim();if(!goalText){toast('先填写目标，或选择下面的示例任务。');return;}const mode=root.querySelector('#os-mode').value;const s=mode==='auto'?(/方案|视频|设计|协作|宣传/.test(goalText)?'complex':'simple'):mode;openScenario(s);state.userGoal=goalText;render();startReplay();});root.querySelector('#os-reply-form')?.addEventListener('submit',ev=>{ev.preventDefault();const text=root.querySelector('#os-reply').value.trim();if(!text){toast('填写补充要求后发送。');return;}if(state.stage==='approval'){toast('参数修改需要重新裁定。本样板保留待确认状态。');return;}stopStream();state.reason=text;state.revision++;state.stage='complete';state.reply='已按你的修改说明生成关联新版本。这里演示版本交互，尚未调用真实模型。';render();save();});root.querySelector('#os-layout')?.addEventListener('change',ev=>{design.layout=ev.target.value;save();toast('布局偏好已在本样板中更新。');});}
function startReplay(){stopStream();state.paused=false;state.running=true;state.step=0;state.characters=0;state.stage='complete';state.tab='chat';render();
const update=()=>{const area=root.querySelector('#os-stream-area');if(area){area.innerHTML=messageContent();icons();}};
const tick=()=>{if(!state.running||state.view!=='thread')return;state.step++;state.characters=0;update();
if(state.step===1||state.step===6){const typing=()=>{if(!state.running||state.view!=='thread')return;state.characters+=4;update();if(state.characters<100){streamTimer=setTimeout(typing,55);return;}if(state.step===6){state.running=false;state.step=7;render();return;}streamTimer=setTimeout(tick,700);};streamTimer=setTimeout(typing,55);return;}
streamTimer=setTimeout(tick,850);};streamTimer=setTimeout(tick,300);}

function dialog(title,html){focusRestore=document.activeElement;overlay.innerHTML=`<div class="os-overlay-mask"><section class="os-dialog" role="dialog" aria-modal="true" aria-label="${e(title)}"><div class="os-dialog-head"><h3>${e(title)}</h3><button data-action="close" aria-label="关闭对话框">${i('x')}</button></div>${html}</section></div>`;icons();overlay.querySelector('button')?.focus();}
function close(){overlay.innerHTML='';focusRestore?.focus();}
function download(){if(state.scenario==='approval'){toast('媒体卡为占位，没有实际图片可下载。');return;}const text=`# ${title()}\n\n> 合成设计样板，非真实模型产物。\n\n## 摘要\n${state.scenario==='simple'?'项目共有 3 项任务，2 项已完成，1 项因输入缺失阻塞。':'活动方案以城市漫步为主题，日期保持待确认；宣传视觉为 UI 占位。'}\n\n## 下一步建议\n${state.scenario==='simple'?'补齐输入后继续验证。':'确认日期后继续完善活动文案。'}\n\n## 来源\n${state.scenario==='simple'?'[1] 合成项目记录，第 2 段。':'[1] 合成品牌规范，第 3 节。'}\n\n## 版本\nv${state.revision}；新版本保留关联，旧版不覆盖。\n`;const url=URL.createObjectURL(new Blob([text],{type:'text/markdown;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='agentos-design-example.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已下载明确标注的合成报告示例。');}
root.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b||!root.contains(b))return;if(b.dataset.view){navigate(b.dataset.view);return;}if(b.dataset.scenario){openScenario(b.dataset.scenario);return;}if(b.dataset.tab){state.tab=b.dataset.tab;render();save();return;}if(b.dataset.hub){state.hub=b.dataset.hub;render();save();return;}if(b.dataset.filter){state.filter=b.dataset.filter;render();return;}if(b.dataset.node){state.node=b.dataset.node;root.querySelector('#os-right').innerHTML=nodeDetail();root.querySelectorAll('[data-node]').forEach(n=>n.classList.toggle('is-selected',n.dataset.node===state.node));icons();return;}if(b.dataset.backend){state.backend=b.dataset.backend;render();toast('新任务默认使用'+(state.backend==='weknora'?' WeKnora':'内置检索')+'；已有任务绑定保持不变。');save();return;}if(b.dataset.cap){dialog(b.dataset.cap,`<p>此能力通过统一边界接入，运行时固定版本和授权范围。</p><div class="os-status-list"><div>来源：示例配置</div><div>连接验证：样板状态，未实际探针</div><div>权限：只读检索或按风险确认写入</div></div><button class="os-button" data-action="close">返回能力中心</button>`);return;}const action=b.dataset.action;
if(action==='menu')root.querySelector('.os-sidebar').classList.toggle('is-open');
else if(action==='close')close();
else if(action==='guide')dialog('这版设计怎样评估',`<p>从新任务开始，分别打开简单、复杂和需要确认的示例。</p><ul><li>对话：查看文字、工具调用与角色交接。</li><li>执行图：查看并行、汇总、评审退回与最终交付。</li><li>成果：预览、来源回查、下载合成示例与修改版本。</li><li>能力中心：查看 MCP、Skill、知识后端、执行设备；切换只影响新任务。</li></ul><p>流式过程、角色协作、WeKnora 和连接状态均为设计演示，尚未接入这些真实链路。</p>`);
else if(action==='inbox')dialog('需要你处理',`<p>确认是任务中的一个状态，通知帮助你找到需要介入的位置。</p><button class="os-task-row" data-scenario="approval"><span><strong>西湖主题宣传素材</strong><p>请确认本次生成内容和参数。</p></span>${i('arrow-right')}</button>`);
else if(action==='attach')dialog('添加资料',`<p>样板使用合成文本，不读取你的本地文件。</p><label for="os-material">材料内容</label><textarea id="os-material">项目甲计划做 3 项任务，2 项已完成，1 项因输入缺失阻塞。</textarea><button class="os-button os-primary" data-action="attach-save">添加到任务</button>`);
else if(action==='attach-save'){state.attached=true;close();render();toast('合成材料已添加。');}
else if(action==='approve'){state.stage='complete';state.notification=false;state.tab='chat';render();startReplay();toast('已确认本次示例调用。');}
else if(action==='reject'){state.refused=true;state.notification=false;state.stage='complete';render();toast('已拒绝，样板不会继续生成。');}
else if(action==='replay')startReplay();
else if(action==='pause'){stopStream();state.paused=true;render();toast('示例回放已暂停；没有实际任务被取消。');}
else if(action==='open-artifact'){state.tab='files';render();root.querySelector('#os-right')?.classList.add('mobile-visible');}
else if(action==='show-node'){root.querySelector('#os-right')?.classList.add('mobile-visible');root.querySelector('#os-right')?.scrollIntoView({behavior:'smooth',block:'start'});}
else if(action==='source')dialog('来源片段',`<p>${state.scenario==='simple'?'项目记录 · 第 2 段':'品牌规范 · 第 3 节'} · 固定来源版本 v1</p><div class="os-doc-quote">${state.scenario==='simple'?'项目甲计划做 3 项任务，其中 2 项已完成，1 项因输入缺失阻塞。':'品牌表达强调自然、克制与轻量。活动简报未提供已确认的日期。'}</div><p>知识后端：${backend()}（示例）。正式引用回查会再次校验来源权限。</p>`);
else if(action==='tool-detail')dialog('步骤检查器',`<p>查看已保存的指令和输入输出，不展示模型内部推理。</p><div class="os-status-list"><div><b>系统指令</b><br>仅使用已授权来源；缺少依据时保留未决项。</div><div><b>输入</b><br>本任务目标、来源引用和上一角色交付。</div><div><b>输出</b><br>结构化结论、引用及可交付成果。</div></div><button class="os-button" data-action="failure">体验回传失败状态</button>`);
else if(action==='failure'){close();state.failure=true;state.tab='chat';render();}
else if(action==='deliver'){state.failure=false;render();toast('示例成果补传完成，生成步骤未重跑。');}
else if(action==='revise')dialog('基于成果提出修改',`<p>修改会产生关联的新版本。原成果与来源继续保留。</p><label for="os-revision">修改说明</label><textarea id="os-revision" placeholder="例如：把活动日期改为待确认，并保留原视觉稿"></textarea><button class="os-button os-primary" data-action="revise-save">生成示例新版本</button>`);
else if(action==='revise-save'){const text=root.querySelector('#os-revision').value.trim();if(!text){toast('填写修改说明后继续。');return;}state.revision++;state.reason=text;state.stage='complete';state.tab='chat';close();render();toast('示例新版本已关联，旧版本保留。');}
else if(action==='download')download();
else if(action==='visual')dialog('活动宣传视觉',`<p>这是一张视觉成果占位卡。UI 设计阶段未生成图片，也没有调用 Windows。</p><div class="os-status-list"><div>正式交付：缩略图、原图预览与授权下载。</div><div>版本：v1；方案返修后继续复用。</div></div>`);
else if(action==='connect')dialog('连接能力',`<p>按能力类型接入，凭据保存在服务端。</p><div class="os-design-toggle"><button class="os-button" data-action="connect-mcp">MCP 服务</button><button class="os-button" data-action="connect-skill">Skill 包</button><button class="os-button" data-action="connect-knowledge">知识后端</button></div><p>此处演示接入入口；不会安装软件或连接外部服务。</p>`);
else if(action==='connect-mcp')dialog('连接 MCP 服务',`<label for="os-service-name">服务名称</label><input id="os-service-name" value="示例知识服务"><label for="os-service-url">服务地址</label><input id="os-service-url" value="https://example.invalid/mcp"><p>连接流程：配置 → 验证 → 发现工具 → 收窄权限 → 启用。</p><button class="os-button os-primary" data-action="connect-save">验证示例连接</button>`);
else if(action==='connect-save'){dialog('示例连接结果',`<div class="os-status-list"><div>配置格式：通过</div><div>真实连通性：未验证</div><div>工具发现：样板示例</div></div><p>正式版本只有真实验证通过才允许启用。</p>`);}
else if(action==='connect-skill')dialog('安装 Skill',`<p>指定来源与固定版本，查看声明的工具和资源，审核后启用。</p><div class="os-status-list"><div>report-writer · 示例 v1.2</div><div>允许能力：材料读取、知识检索、报告保存</div><div>安装成功不等于授予工具执行权限。</div></div>`);
else if(action==='connect-knowledge'){close();state.hub='knowledge';navigate('hub');}
else if(action==='split'){design.split=!design.split;render();save();}
});
window.addEventListener('openai:set_globals',ev=>{const next=ev.detail?.globals?.widgetState;if(!next)return;const m=next.modelContent||{},p=next.privateContent||{};let changed=false;const set=(obj,key,value)=>{if(obj[key]!==value){obj[key]=value;changed=true;}};if(['home','tasks','library','hub','settings'].includes(m.screen))set(state,'view',m.screen);if(['simple','complex','approval'].includes(m.scenario))set(state,'scenario',m.scenario);if(['weknora','builtin'].includes(m.knowledgeBackend))set(state,'backend',m.knowledgeBackend);if(typeof p.split==='boolean')set(design,'split',p.split);if(changed)render();});
root.addEventListener('keydown',ev=>{if(ev.key==='Escape'){if(overlay.children.length)close();else root.querySelector('.os-sidebar').classList.remove('is-open');}if((ev.metaKey||ev.ctrlKey)&&ev.key.toLowerCase()==='k'){ev.preventDefault();navigate('home');root.querySelector('#os-goal')?.focus();}if(ev.key==='Tab'&&overlay.children.length){const list=[...overlay.querySelectorAll('button,input,textarea,select')].filter(el=>!el.disabled);if(!list.length)return;const first=list[0],last=list.at(-1);if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last.focus();}else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus();}}});
const saved=globalThis.openai?.widgetState;if(saved?.modelContent?.screen&&['home','tasks','library','hub','settings'].includes(saved.modelContent.screen))state.view=saved.modelContent.screen;
render();
if(globalThis.Tweak){let previous={...design};const tweak=new Tweak({container:root,onChange:()=>{if(JSON.stringify(previous)===JSON.stringify(design))return;if(previous.layout!==design.layout&&state.view==='thread'&&state.scenario==='complex')state.tab=design.layout==='协作优先'?'flow':'chat';previous={...design};render();save();}});tweak.addSelect(design,'layout',{label:'工作区布局',options:['对话优先','协作优先']});tweak.addToggle(design,'split',{label:'并排显示成果 / 步骤'});tweak.addColorPicker(design,'accent',{label:'交互强调色',reference:'--os-accent'});}
})();
</script>
