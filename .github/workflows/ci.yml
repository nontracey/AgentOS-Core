name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy src/agentos
      - name: Import boundaries (kernel/runtime independence)
        run: uv run lint-imports
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests
        run: uv run pytest
      - name: Contract schema drift check
        run: uv run python scripts/export_contracts.py --check
      - name: Dependency direction check
        run: uv run python scripts/check_dependencies.py

      - name: Document consistency
        run: uv run python scripts/check_documents.py
      - name: Architecture diagram drift
        run: uv run python scripts/render_diagrams.py --check
      - name: Install verified Gitleaks
        run: |
          curl -fL --retry 2 -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Public file privacy gate (redacted)
        run: GITLEAKS_BIN=/tmp/gitleaks uv run python scripts/check_privacy.py
      - name: Build same-origin workflow editor
        working-directory: frontend/workflow
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Build and verify standalone wheel
        run: |
          uv build --wheel
          uv run python scripts/check_wheel.py dist/agentos-0.1.0-py3-none-any.whl
